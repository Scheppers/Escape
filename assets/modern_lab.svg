<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Getekend chemielokaal</title><desc id="desc">Een kleurrijk chemielokaal met periodiek systeem, reageerbuizen, weegschaal, maatkolf en een gesloten deur.</desc>
